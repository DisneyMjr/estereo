plugins { id 'com.android.application' version '8.11.1' }
android {
    namespace 'com.disneymjr.estereo'
    compileSdk 36
    defaultConfig {
        applicationId 'com.disneymjr.estereo'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.3'
    }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/estereo')
}
tasks.register('copyEstereo', Copy) {
    from(rootProject.projectDir.parentFile) {
        include 'index.html', 'app.js', 'style.css', 'mobile.js'
    }
    into layout.buildDirectory.dir('generated/estereo')
    filesMatching("index.html") { filter { line -> line.replace("media-src 'self' blob: https://*.googlevideo.com; ", '').replace("object-src 'none'", "connect-src https:; media-src 'self' blob: https:; object-src 'none'").replace('<script src="app.js" defer></script>', '<script src="mobile.js" defer></script><script src="app.js" defer></script>') } }
}
tasks.named('copyEstereo') { from(rootProject.projectDir.parentFile) { include 'icon.png' } }
tasks.named('preBuild') { dependsOn 'copyEstereo' }
dependencies { implementation 'androidx.webkit:webkit:1.13.0' }





