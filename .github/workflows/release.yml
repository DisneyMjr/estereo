name: Distribuição desktop
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            args: --win nsis --x64
            file: dist/*.exe
          - os: ubuntu-latest
            args: --linux AppImage deb --x64
            file: |
              dist/*.AppImage
              dist/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run dist -- ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: estereo-${{ matrix.os }}
          path: ${{ matrix.file }}
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: estereo-*
          path: release
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

